services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    ports:
      - "8888:8888"
    restart: unless-stopped
    depends_on:
      - db
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend

  db:
    image: postgres:17-alpine
    # restart: always
    # set shared memory limit when using docker compose
    shm_size: 64mb
    environment:
      POSTGRES_PASSWORD: this_isnt_secure
    ports:
      - "1234:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/db.sql
      - ./db/data:/var/lib/postgresql/data # save data somewhere local
      
  

